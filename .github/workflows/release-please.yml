name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-slim
    outputs:
      # The root package's release pull request branch when this run created or updated it, else ''.
      # Each package gets its own release pull request (separate-pull-requests in
      # release-please-config.json): with one combined pull request on release-please--branches--main,
      # release-please cannot tag a release that holds only the root package, as its branch has no
      # component and the root package's component is pi-agent.
      branch: ${{ contains(steps.release.outputs.prs, '"release-please--branches--main--components--pi-agent"') && 'release-please--branches--main--components--pi-agent' || '' }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # pi installs git packages without building them (npm install --omit=dev, no build step), so the
  # built extensions pi loads (dist/scenario-profile.js, dist/agent-docs.js, dist/subagent.js, see "pi.extensions")
  # are committed. They are built here into the release pull request, so the release commit and its
  # tag contain them.
  # release-please regenerates its branch when main moves, dropping this commit; this job then
  # runs again right after.
  build:
    needs: release-please
    if: needs.release-please.outputs.branch != ''
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ needs.release-please.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Commit the built extensions
        run: |
          git add dist/scenario-profile.js dist/agent-docs.js dist/subagent.js
          if git diff --cached --quiet; then
            echo "dist/scenario-profile.js, dist/agent-docs.js and dist/subagent.js are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: build dist/scenario-profile.js, dist/agent-docs.js and dist/subagent.js"
          git push origin "HEAD:$BRANCH"
